name: YouTube Automation Bot

on:
  schedule:
    - cron: '0 8 * * *' # Yeh rozana subah 8 baje automatic chalega
  workflow_dispatch: # Aap isay button daba kar manually bhi chala sakte hain

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-genai gtts moviepy Pillow

      - name: Run Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python youtube_automation.py
