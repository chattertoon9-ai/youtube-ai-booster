name: Mysterious AI Shorts Auto Pipeline

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test without uploading (1 = yes, 0 = no)"
        required: false
        default: "0"
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy requests pillow moviepy==1.0.3 edge-tts gTTS google-api-python-client google-auth

      - name: Execute Mysterious AI Auto Pipeline
        env:
          PYTHONPATH: "."
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }} GEMINI_API_KEY_2:${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }} GEMINI_API_KEY_4:${{ secrets.GEMINI
