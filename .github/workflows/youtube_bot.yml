name: YouTube Automation Bot

on:
  schedule:
    - cron: '0 8 * * *' # Rozana subah 8 baje chalega
  workflow_dispatch: # Manual run karne ke liye

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # Permissions lazmi hain taake GitHub Actions repository mein file save kar sake
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-genai gtts moviepy Pillow

      - name: Run Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python youtube_automation.py

      - name: Commit and Push Generated Video
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Check karein ke video file bani hai ya nahi
          if [ -f "final_video.mp4" ]; then
            git add final_video.mp4
            git commit -m "auto: add newly generated automated video [skip ci]"
            git push
          else
            echo "Video file not found!"
            exit 1
          fi
