name: Cinematic AI Shorts Auto Pipeline

on:
  schedule:
    - cron: '0 12 * * *'  # Har roz UTC time ke mutabiq dopahar 12 baje (Pakistan time ke mutabiq shaam 5 baje) yeh khud chal paray ga
  workflow_dispatch:      # Isse aap jab chahein button daba kar manually bhi chala sakte hain

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-api-python-client google-auth-oauthlib requests Pillow moviepy gtts

      - name: Execute Mysterious AI Auto Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TEKEN: ${{ secrets.YOUTUBE_REFRESH_TEKEN }}
        run: |
          python main.py
